spring.application.name=trustfix-backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trustfix}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=${PORT:8085}

# JWT Configuration (Mandatory minimum 256-bit / 32-char key in production)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Application & Seeding Settings
app.seed-demo-data=${APP_SEED_DEMO_DATA:true}
admin.email=${ADMIN_EMAIL:admin@trustfix.com}
admin.password=${ADMIN_PASSWORD:}

# CORS Allowed Origins (Comma-separated)
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Authentication Rate Limiting
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login.max-requests=${RATE_LIMIT_LOGIN_MAX:10}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW:60}
app.rate-limit.register.max-requests=${RATE_LIMIT_REGISTER_MAX:5}
app.rate-limit.register.window-seconds=${RATE_LIMIT_REGISTER_WINDOW:60}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always