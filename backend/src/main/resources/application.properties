spring.application.name=trustfix-backend

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trustfix}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8085}

jwt.secret=${JWT_SECRET:TrustFixSecretKeyForJwtAuthentication2026Secure}
jwt.expiration-ms=86400000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always