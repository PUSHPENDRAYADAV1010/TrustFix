spring.application.name=trustfix-backend-test

# Datasource configuration for tests
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trustfix}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none

# JWT Test Secret (Min 256-bit)
jwt.secret=TrustFixAutomatedTestEnvironmentJwtSecretKeyAtLeast32BytesLong!
jwt.expiration-ms=86400000

# Seeding Settings for Tests
app.seed-demo-data=false
admin.email=admin@trustfix.com
admin.password=Admin@123

# Disable rate limit by default in unit/slice tests to allow rapid test calls
app.rate-limit.enabled=false

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
