version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: trustfix-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-trustfix}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustfix-backend
    restart: always
    depends_on:
      - mysql
    ports:
      - "8085:8085"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-trustfix}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-TrustFixSecretKeyForJwtAuthentication2026Secure}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustfix-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
